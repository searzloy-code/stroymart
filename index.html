<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a href="#" class="navbar-brand fw-bold text-warning">BUILDING SHOP EPTA</a>
            <span class="navbar-text text-white">
                ALL YOU NEED FOR CONSTRUCTION
            </span>
        </div>
    </nav>

    <div class="container my-5">

        <div class="row mb-5 justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-warning">
                    <div class="card-header bg-warning text-dark fw-bold">
                        FLOOR CALCULATOR
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Length (meters)</label>
                                <input type="number" id="room-length" class="form-control" placeholder="ex.: 5">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Width (meters)</label>
                                <input type="number" id="room-width" class="form-control" placeholder="ex.: 5">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Price per m2 (BYN)</label>
                                <input type="number" id="price-per-m2" class="form-control" placeholder="ex.: 800">
                            </div>
                        </div>
                        <button id="calc-btn" class="btn btn-warning w-100 mt-3 fw-bold">CALCULATE PRICE</button>
                        <div id="result" class="mt-3 p-3 bg-light rounded text-center fw-bold">result will appear right
                            here</div>
                    </div>
                    <div class="card p-3 mb-4 bg-light shadow-sm border-0">
                        <label for="price-range" class="fw-bold mb-2">
                            PRICE FILTER: <span id="price-value" class="text-warning fw-bold fs-5">7000</span> BYN
                        </label>
                        <div id="price-slider"></div>
                    </div>
                </div>
            </div>
        </div>
        <section class="mb-5">
            <h2 class="border-bottom pb-2 mb-4">CATALOG</h2>

            <div id="products-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">

            </div>
        </section>

        <section>
            <h2 class="border-bottom pb-2 mb-4">
                SHOPPING CART
                <span id="cart-count class=badge bg-warning text-dark">0</span>
            </h2>
            <ul id="cart-list" class="list-group shadow-sm">

            </ul>
        </section>
    </div>

    <!-- Подключаем сам jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Подключаем jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
